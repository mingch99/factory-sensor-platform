services:
  postgres:
    image: postgres:16
    container_name: factory-postgres
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory123
      POSTGRES_DB: factory_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
